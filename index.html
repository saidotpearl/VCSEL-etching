<!DOCTYPE html>
<html>
<head>
    <title>Semiconductor Etching Simulator</title>
    <style>
        body { font-family: Arial; text-align: center; margin: 20px; }
        video { background: #000; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Semiconductor Etching Simulator</h1>
    <img src="pre_etch.png" width="400">
    <br><br>
    <label>Plasma Power:</label>
    <select id="power">
        <option value="1">1 (Low)</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5 (High)</option>
    </select>
    <br><br>
    <label>Etchant Quantity:</label>
    <select id="etchant">
        <option value="1">1 (Low)</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5 (High)</option>
    </select>
    <br><br>
    <button onclick="startEtch()">Start Etching!</button>
    <br><br>
    <video id="etchVideo" width="500" controls></video>
    <p id="result"></p>

    <script>
        function startEtch() {
            const power = document.getElementById("power").value;
            const etchant = document.getElementById("etchant").value;
            const video = document.getElementById("etchVideo");
            const result = document.getElementById("result");

            // Only Power 2 + Etchant 5 is correct
            if (power === "2" && etchant === "5") {
                result.innerHTML = "✅ Perfect etch! (Power 2 + Etchant 5)";
            } else {
                result.innerHTML = "❌ Over/under-etched! Try Power 2 + Etchant 5.";
            }

            // Play the corresponding video (replace FILE_ID with your Google Drive IDs)
            video.src = `https://drive.google.com/uc?export=download&id=FILE_ID_POWER_${power}_ETCHANT_${etchant}`;
            video.load();
            video.play();
        }
    </script>
</body>
</html>
